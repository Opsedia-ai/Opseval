# SPDX-License-Identifier: Apache-2.0
#
# Nothing is published unless the evaluation exits 0. Drop this file in .github/workflows/.
#
# Exit codes of the eval job, and what `needs: eval` does with them:
#   0  pass                                -> release runs
#   1  the agent failed                    -> release is skipped
#   2  not judged (nothing was measured)   -> release is skipped: "not judged", not a failure
#   3  harness or configuration error      -> release is skipped: a harness error
# Never add `if: always()` or `if: failure()` to the release job: 2 and 3 must never ship.
#
# The reusable workflow lives in Opseval's main repository. Replace both <sha> with the same
# full Opseval commit SHA: the first picks the workflow, opseval-ref the action it runs.
# (Until go-public (Gate 0) the repository is private, so this works only inside it.)
#
# This job's `env:` would not reach a called workflow: settings go in as inputs. The four
# endpoint inputs below, and `opseval-env` (one OPSEVAL_NAME=value per line) for any other
# non-secret setting. Keys go only through `secrets:`; a key given without its base URL and
# model is refused (exit 3), since nothing would use it.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  eval:
    permissions:
      contents: read
    uses: Opsedia-ai/Opseval/.github/workflows/opseval-eval.yml@<sha>
    with:
      opseval-ref: <sha>
      suite: evals/suites/release.yaml
      profile: evals/profile.yaml
      target: wss://agent.staging.example.com/ws
      allowed-hosts: agent.staging.example.com,api.openai.com
      simulator-base-url: ${{ vars.OPSEVAL_SIMULATOR_BASE_URL }}
      simulator-model: ${{ vars.OPSEVAL_SIMULATOR_MODEL }}
      judge-base-url: ${{ vars.OPSEVAL_JUDGE_BASE_URL }}
      judge-model: ${{ vars.OPSEVAL_JUDGE_MODEL }}
      opseval-env: |
        OPSEVAL_SIMULATOR_TIMEOUT_SECONDS=120
    secrets:
      simulator-api-key: ${{ secrets.OPSEVAL_SIMULATOR_API_KEY }}
      judge-api-key: ${{ secrets.OPSEVAL_JUDGE_API_KEY }}

  release:
    needs: eval # skipped on exit 1, 2 or 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        env:
          OPSEVAL_EXIT_CODE: ${{ needs.eval.outputs.exit-code }} # always 0 here
        run: ./scripts/publish.sh
