[project]
name = "opseval-workspace"
version = "0.0.0"
description = "Opseval monorepo workspace (not published)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/opseval", "packages/pytest-opseval"]

[tool.uv.sources]
opseval = { workspace = true }
pytest-opseval = { workspace = true }

[dependency-groups]
# The wheel's build backend, locked with hashes for the container image (ADR-0038).
build = ["hatchling>=1.24"]
dev = [
  "opseval[server]",
  "pytest-opseval",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
  "import-linter>=2.15",
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
  "pip-licenses>=5.5.5",
  "mkdocs-material>=9.5",
  "mkdocs>=1.6,<2",  # MkDocs 2 drops the plugin and theme system Material is built on
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/opseval/src", "packages/opseval/tests", "packages/pytest-opseval/src", "packages/pytest-opseval/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "DTZ", "S", "RUF100"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"packages/opseval/tests/**" = ["S", "BLE"]
"packages/pytest-opseval/tests/**" = ["S", "BLE"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "packages/opseval/src:packages/pytest-opseval/src"
packages = ["opseval", "pytest_opseval"]

[tool.pytest.ini_options]
testpaths = ["packages/opseval/tests", "packages/pytest-opseval/tests"]
asyncio_mode = "auto"
# The pytest-opseval entry point is disabled for our own run (it would import opseval
# before coverage starts); its tests load it explicitly with -p pytest_opseval.plugin.
addopts = "-p pytester -p no:opseval"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_packages = ["opseval"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The open-source core never imports Enterprise code (ADR-0002)"
type = "forbidden"
source_modules = ["opseval"]
forbidden_modules = ["ee", "opseval_ee"]

[[tool.importlinter.contracts]]
name = "Data models depend on nothing else in opseval"
type = "forbidden"
source_modules = ["opseval.models"]
forbidden_modules = [
  "opseval.cli",
  "opseval.runner",
  "opseval.driver",
  "opseval.transport",
  "opseval.simulator",
  "opseval.scoring",
  "opseval.traces",
  "opseval.reporting",
  "opseval.verdicts",
]

[[tool.importlinter.contracts]]
name = "Scorers read only the frozen record: no transports, driver or simulator (record first, judge later)"
type = "forbidden"
source_modules = ["opseval.scoring"]
forbidden_modules = ["opseval.transport", "opseval.driver", "opseval.simulator", "opseval.runner"]

[[tool.importlinter.contracts]]
name = "Re-scoring is offline: no transports, driver, simulator or runner"
type = "forbidden"
source_modules = ["opseval.rescore"]
forbidden_modules = ["opseval.transport", "opseval.driver", "opseval.simulator", "opseval.runner"]

[[tool.importlinter.contracts]]
name = "Telemetry sees results, never conversations: no records, driver, transports or simulator"
type = "forbidden"
source_modules = ["opseval.telemetry"]
forbidden_modules = [
  "opseval.driver",
  "opseval.transport",
  "opseval.simulator",
  "opseval.traces",
  "opseval.storage",
]

[[tool.importlinter.contracts]]
name = "Calibration is offline and read-only: no transports, driver, simulator or runner"
type = "forbidden"
source_modules = ["opseval.calibrate"]
forbidden_modules = ["opseval.transport", "opseval.driver", "opseval.simulator", "opseval.runner"]

[[tool.importlinter.contracts]]
name = "Local mode never needs the database: the run path imports no server-mode code (ADR-0047)"
type = "forbidden"
source_modules = [
  "opseval.runner",
  "opseval.driver",
  "opseval.transport",
  "opseval.simulator",
  "opseval.scoring",
  "opseval.catalogue",
  "opseval.storage",
  "opseval.verdicts",
  "opseval.models",
  "opseval.reporting",
  "opseval.rescore",
  "opseval.calibrate",
]
forbidden_modules = ["opseval.db", "sqlalchemy", "asyncpg", "alembic"]

[tool.bandit]
# opseval/testing.py is the plugin contract test kit: its assertions are its product,
# written in the pytest idiom so a plugin author's failures read normally. It is only
# ever imported from a test suite, never on a run path.
exclude_dirs = ["packages/opseval/tests", "packages/opseval/src/opseval/testing.py"]
