[project]
name = "opseval-workspace"
version = "0.0.0"
description = "Opseval monorepo workspace (not published)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/opseval"]

[tool.uv.sources]
opseval = { workspace = true }

[dependency-groups]
dev = [
  "opseval",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "import-linter>=2.15",
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
  "pip-licenses>=5.5.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/opseval/src", "packages/opseval/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "DTZ", "S", "RUF100"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"packages/opseval/tests/**" = ["S", "BLE"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "packages/opseval/src"
packages = ["opseval"]

[tool.pytest.ini_options]
testpaths = ["packages/opseval/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_packages = ["opseval"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The open-source core never imports Enterprise code (ADR-0002)"
type = "forbidden"
source_modules = ["opseval"]
forbidden_modules = ["ee", "opseval_ee"]

[[tool.importlinter.contracts]]
name = "Data models depend on nothing else in opseval"
type = "forbidden"
source_modules = ["opseval.models"]
forbidden_modules = [
  "opseval.cli",
  "opseval.runner",
  "opseval.driver",
  "opseval.transport",
  "opseval.simulator",
  "opseval.scoring",
  "opseval.traces",
  "opseval.reporting",
  "opseval.verdicts",
]

[[tool.importlinter.contracts]]
name = "Scorers read only the frozen record: no transports, driver or simulator (record first, judge later)"
type = "forbidden"
source_modules = ["opseval.scoring"]
forbidden_modules = ["opseval.transport", "opseval.driver", "opseval.simulator", "opseval.runner"]

[[tool.importlinter.contracts]]
name = "Re-scoring is offline: no transports, driver, simulator or runner"
type = "forbidden"
source_modules = ["opseval.rescore"]
forbidden_modules = ["opseval.transport", "opseval.driver", "opseval.simulator", "opseval.runner"]

[tool.bandit]
exclude_dirs = ["packages/opseval/tests"]
