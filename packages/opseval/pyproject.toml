[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opseval"
dynamic = ["version"]
description = "Release-grade, black-box evaluation for conversational AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Opsedia" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=13",
  "jinja2>=3.1",
]

[project.scripts]
opseval = "opseval.cli:app"

[tool.hatch.version]
path = "src/opseval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opseval"]
