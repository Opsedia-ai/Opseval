[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opseval"
dynamic = ["version"]
description = "Release-grade, black-box evaluation for conversational AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Opsedia" }]
dependencies = [
  "python-dotenv>=1.0",   # Settings.secret_named: a .env value reaches Settings, never os.environ
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.15",  # 0.15 exits 130 on Ctrl-C; older Typer exits 1, "the agent failed"
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=13",
  "jinja2>=3.1",
  "jsonschema>=4.21",
]

[project.scripts]
opseval = "opseval.cli:entrypoint"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.hatch.version]
path = "src/opseval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opseval"]
