[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opseval"
dynamic = ["version"]
description = "Release-grade, black-box evaluation for conversational AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Opsedia" }]
dependencies = [
  "python-dotenv>=1.0",   # Settings.secret_named: a .env value reaches Settings, never os.environ
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.15",  # 0.15 exits 130 on Ctrl-C; older Typer exits 1, "the agent failed"
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=13",
  "jinja2>=3.1",
  "jsonschema>=4.21",
]

[project.scripts]
opseval = "opseval.cli:entrypoint"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# Voice: audio recorded by a voice run is encrypted at rest with AES-256-GCM (ADR-0053).
# Only a voice run that keeps audio files needs it; the core never imports it.
voice = [
    "cryptography>=44",
]
# Server mode on Postgres, the Langfuse model (ADR-0047). asyncpg rather than psycopg:
# psycopg is LGPL, which the dependency licence allowlist does not admit.
server = [
    "opseval[serve]",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Accounts and access (ADR-0050): argon2id passwords (MIT) and OIDC ID tokens (PyJWT,
    # MIT; its crypto extra is cryptography, Apache-2.0/BSD).
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
]

[tool.hatch.version]
path = "src/opseval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opseval"]
