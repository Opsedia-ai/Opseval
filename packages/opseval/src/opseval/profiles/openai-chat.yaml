# Built-in SUT profile for any agent exposed as an OpenAI-compatible Chat Completions API.
# Use it with:  opseval run ... --transport openai-chat --profile builtin:openai-chat
#
# The openai-chat transport keeps the conversation history, sends it to
# POST {target}/chat/completions and turns each reply into a canonical message frame.
# There are no approval checkpoints in this protocol, so scenarios use stop_at: goal_reached.
name: openai-chat
description: Any agent behind an OpenAI-compatible /chat/completions endpoint.

kind_field: type
kinds:
  message: message
  error: error
session_id_field: null
text_field: text
phase_field: null
data_field: data
tool_calls_field: tool_calls
turn_end_field: expects_reply

user_message_frame: {type: user_message, text: "{text}"}

transport_options:
  model: default          # sent as "model"; many agent gateways ignore it
  # system_prompt: "You are the support assistant for ..."   # optional first message
  # temperature: 0
  # extra_body: {}        # merged into every request body

# Declare the tools your agent may call, so tool scorers can check them. Tool calls are
# read from the `tool_calls` the endpoint returns (degraded mode) or, better, from traces.
tools: {}
