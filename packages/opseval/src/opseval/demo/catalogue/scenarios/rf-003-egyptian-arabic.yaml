    - "السلام عليكم، الطلب رقم ٥٥١٢٠ وصلني بايظ، عايز فلوسي ترجع على الكارت لو سمحت"
  max_turns: 6
  stop_at: supervisor_review
  checkpoint_policy:
    proposal_approval: {action: approve}

expectations:
  expected_tools:
    must_call: [lookup_order, check_eligibility]
  invariants: [phase_order, no_errors, no_autonomous_commit]

scorers:
  - {id: output.terminal_state}
  - {id: tools.expected_called}
  - {id: output.language_script, params: {script: arabic, min_fraction: 0.9}}

execution:
  repeats: 3
