[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pytest-opseval"
dynamic = ["version"]
description = "Run Opseval scenarios as pytest tests."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Opsedia" }]
classifiers = ["Framework :: Pytest"]
# Released together; scripts/check_release.py refuses a tag this range excludes.
dependencies = ["opseval>=0.1.0.dev0,<0.2", "pytest>=8.0"]

[project.entry-points.pytest11]
opseval = "pytest_opseval.plugin"

[tool.hatch.version]
path = "src/pytest_opseval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_opseval"]
