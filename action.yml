# SPDX-License-Identifier: Apache-2.0
name: Opseval
description: >-
  Run an Opseval suite against a deployed conversational agent, upload the report and
  JUnit results, and post the release-gate summary on the pull request. The step's exit
  code is Opseval's: 0 pass · 1 fail · 2 not judged · 3 harness or configuration error.
author: Opsedia
branding:
  icon: check-circle
  color: green

inputs:
  suite:
    description: Scenario file, directory or suite file to run.
    required: true
  profile:
    description: >-
      SUT profile YAML, or builtin:<name>. Required, except with server-url: the label's own
      profile is used then.
    default: ""
  target:
    description: Agent URL (ws://, wss://, http(s)://).
    required: true
  transport:
    description: websocket | http-json | openai-chat
    default: websocket
  repeats:
    description: Override the scenarios' repeats (1-20). Empty keeps the scenario values.
    default: ""
  filter:
    description: Newline-separated filters (tag=…, id=…, criticality=…).
    default: ""
  extra-args:
    description: Extra arguments for `opseval run`, space-separated (e.g. --no-traces).
    default: ""
  python-version:
    description: Python version to run Opseval with.
    default: "3.12"
  opseval-spec:
    description: >-
      What to install, as a pip requirement (e.g. opseval==0.2.0). Empty installs Opseval
      from this action's own checkout (the same version as the action).
    default: ""
  comment:
    description: Post or update the gate summary as a pull-request comment (needs pull-requests write).
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact (report.html, junit.xml, result.json).
    default: opseval-report
  read-dotenv:
    description: >-
      "true" lets Opseval read a .env file in the workspace. Off by default: a checked-out
      repository must not be able to configure the run (OPSEVAL_DOTENV=false).
    default: "false"
  server-url:
    description: >-
      Report the run to an Opseval server (ADR-0058): pull the catalogue under `label` for
      `project`/`task`, run it here, upload the run. `suite` is then a path inside the pulled
      catalogue (suites/smoke.yaml). Its host must be in OPSEVAL_ALLOWED_HOSTS, with https
      unless loopback. A failed upload never changes the exit code; a failed pull is 3.
    default: ""
  project:
    description: With server-url, the server's project (org/project).
    default: ""
  task:
    description: With server-url, the project's task.
    default: default
  label:
    description: With server-url, the catalogue label to run.
    default: production
  opseval-public-key:
    description: >-
      With server-url, the project API key's public half (OPSEVAL_PUBLIC_KEY). Empty keeps the
      job's own OPSEVAL_PUBLIC_KEY.
    default: ""
  opseval-secret-key:
    description: >-
      With server-url, the key's secret half: pass a secret (secrets.OPSEVAL_SECRET_KEY). Empty
      keeps the job's own OPSEVAL_SECRET_KEY.
    default: ""
  github-token:
    description: Token for the pull-request comment.
    default: ${{ github.token }}

outputs:
  exit-code:
    description: Opseval's exit code.
    value: ${{ steps.run.outputs.exit-code }}
  gate:
    description: pass or block (empty if no result was produced).
    value: ${{ steps.run.outputs.gate }}
  run-dir:
    description: Folder with the run's records, result.json, report.html and junit.xml.
    value: ${{ steps.run.outputs.run-dir }}

runs:
  using: composite
  steps:
    # Installed outside the workspace and with no uv configuration from it: a checked-out
    # repository (a pull request's, a deployment's) must not pick the index, the Python or
    # the cache that Opseval is installed from.
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: ${{ inputs.python-version }}
        working-directory: ${{ runner.temp }}
        enable-cache: "false"
        ignore-empty-workdir: "true"

    - name: Install Opseval
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        OPSEVAL_SPEC: ${{ inputs.opseval-spec }}
        ACTION_PATH: ${{ github.action_path }}
        UV_NO_CONFIG: "1"
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/opseval-venv"
        uv venv --quiet --allow-existing "$venv"   # the action may run more than once per job
        if [ -n "$OPSEVAL_SPEC" ]; then
          source="$OPSEVAL_SPEC"
        elif [ -d "$ACTION_PATH/packages/opseval" ]; then
          source="$ACTION_PATH/packages/opseval"        # the root action.yml
        elif [ -d "$ACTION_PATH/../../packages/opseval" ]; then
          source="$ACTION_PATH/../../packages/opseval"  # integrations/github-action
        else
          echo "::error::No Opseval next to the action; set opseval-spec (e.g. opseval==0.2.0)."
          exit 3
        fi
        uv pip install --quiet --python "$venv/bin/python" "$source"
        echo "$venv/bin" >> "$GITHUB_PATH"
        "$venv/bin/opseval" --version

    - name: Run Opseval
      id: run
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        PROFILE: ${{ inputs.profile }}
        TARGET: ${{ inputs.target }}
        TRANSPORT: ${{ inputs.transport }}
        REPEATS: ${{ inputs.repeats }}
        FILTERS: ${{ inputs.filter }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        READ_DOTENV: ${{ inputs.read-dotenv }}
        SERVER_URL: ${{ inputs.server-url }}
        PROJECT: ${{ inputs.project }}
        TASK: ${{ inputs.task }}
        LABEL: ${{ inputs.label }}
        PUBLIC_KEY_INPUT: ${{ inputs.opseval-public-key }}
        SECRET_KEY_INPUT: ${{ inputs.opseval-secret-key }}
      run: |
        set -uo pipefail
        if [ "$READ_DOTENV" = "true" ]; then export OPSEVAL_DOTENV=true; else export OPSEVAL_DOTENV=false; fi
        # The server key: from the inputs when given, else the job's own environment.
        if [ -n "$SECRET_KEY_INPUT" ]; then
          echo "::add-mask::$SECRET_KEY_INPUT"
          export OPSEVAL_SECRET_KEY="$SECRET_KEY_INPUT"
        fi
        if [ -n "$PUBLIC_KEY_INPUT" ]; then export OPSEVAL_PUBLIC_KEY="$PUBLIC_KEY_INPUT"; fi
        unset SECRET_KEY_INPUT PUBLIC_KEY_INPUT
        server=()
        if [ -n "$SERVER_URL" ]; then
          if [ -z "$PROJECT" ]; then
            echo "::error::server-url needs project (org/project)."
            echo "exit-code=3" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          server=(--server "$SERVER_URL" --project "$PROJECT" --task "${TASK:-default}" --label "${LABEL:-production}")
        elif [ -n "$PROJECT" ]; then
          echo "::error::project needs server-url: without a server nothing would be reported."
          echo "exit-code=3" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        reports="$RUNNER_TEMP/opseval-reports-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RANDOM"
        mkdir -p "$reports"
        args=(run "$SUITE" --target "$TARGET" --transport "$TRANSPORT" --reports-dir "$reports")
        if [ -n "$PROFILE" ]; then args+=(--profile "$PROFILE"); fi
        args+=(${server[@]+"${server[@]}"})
        if [ -n "$REPEATS" ]; then args+=(--repeats "$REPEATS"); fi
        while IFS= read -r f; do
          if [ -n "$f" ]; then args+=(--filter "$f"); fi
        done <<< "$FILTERS"
        # Word-split extra args on purpose (they are flags, not a shell command).
        read -r -a extra <<< "$EXTRA_ARGS"
        # GitHub runs bash with -e: capture the exit code instead of aborting on it.
        code=0
        opseval "${args[@]}" ${extra[@]+"${extra[@]}"} || code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        run_dir=$(find "$reports" -mindepth 1 -maxdepth 1 -type d | head -n 1)
        echo "run-dir=$run_dir" >> "$GITHUB_OUTPUT"
        if [ -n "$run_dir" ] && [ -f "$run_dir/result.json" ]; then
          if gate=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["gate"]["status"])' "$run_dir/result.json"); then
            echo "gate=$gate" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not read the gate from result.json; the exit code still stands."
          fi
        fi
        exit 0

    - name: Upload report
      id: upload
      if: always() && steps.run.outputs.run-dir != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.run.outputs.run-dir }}/report.html
          ${{ steps.run.outputs.run-dir }}/junit.xml
          ${{ steps.run.outputs.run-dir }}/result.json
        if-no-files-found: warn

    # Reporting never decides anything: every lookup here warns and carries on, so a broken
    # comment cannot stop the next step from exiting with Opseval's code.
    - name: Gate summary
      if: always() && steps.run.outputs.run-dir != ''
      shell: bash
      env:
        RUN_DIR: ${{ steps.run.outputs.run-dir }}
        REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        OPSEVAL_DOTENV: "false"
      run: |
        set +e -uo pipefail
        if [ ! -f "$RUN_DIR/result.json" ]; then
          echo "::warning::Opseval produced no result.json (see the step log)."
          exit 0
        fi
        summary="$RUNNER_TEMP/opseval-summary.md"
        url_args=()
        if [ -n "$REPORT_URL" ]; then url_args=(--report-url "$REPORT_URL"); fi
        if ! opseval summary "$RUN_DIR" ${url_args[@]+"${url_args[@]}"} > "$summary"; then
          echo "::warning::Could not write the gate summary; the exit code still stands."
          exit 0
        fi
        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMENT" != "true" ] || [ -z "$PR_NUMBER" ]; then
          exit 0
        fi
        if ! existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- opseval-gate -->"))][0].id // empty' | head -n 1); then
          echo "::warning::Could not list the PR comments (does the token have pull-requests: write?)"
          exit 0
        fi
        if ! body=$(python3 -c 'import json,sys; print(json.dumps({"body": open(sys.argv[1], encoding="utf-8").read()}))' "$summary"); then
          echo "::warning::Could not prepare the PR comment."
          exit 0
        fi
        if [ -n "$existing" ]; then
          echo "$body" | gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input - > /dev/null \
            || echo "::warning::Could not update the PR comment (does the token have pull-requests: write?)"
        else
          echo "$body" | gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - > /dev/null \
            || echo "::warning::Could not post the PR comment (does the token have pull-requests: write?)"
        fi
        exit 0

    # Always, so nothing above can skip it: it re-exits with the recorded code, which keeps
    # 1, 2 and 3 failing; no code at all (the install or the run never finished) is 3.
    - name: Exit with Opseval's exit code
      if: always()
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: |
        case "$CODE" in
          0|1|2|3) exit "$CODE" ;;
          "") echo "::error::Opseval did not finish (see the steps above): a harness error."; exit 3 ;;
          *) exit "$CODE" ;;
        esac
