name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (lockfile must be up to date)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Import boundaries (core never imports ee/; scorers never touch transports)
        run: uv run lint-imports
      - name: Security lint
        run: uv run bandit -c pyproject.toml -r packages/opseval/src packages/pytest-opseval/src -q
      - name: Published schemas match the models
        run: uv run opseval schemas --check
      - name: Project status percentages match their table (docs/STATUS.md)
        run: uv run python scripts/project_status.py --check
      - name: Reference pages match the code (docs/reference/)
        run: uv run python scripts/reference_docs.py --check
      - name: Documentation site builds strictly (no broken link or anchor)
        run: uv run mkdocs build
      - run: uv run mypy
      - run: uv run pytest --cov=opseval --cov=pytest_opseval --cov-report=term-missing --cov-fail-under=85
      - name: Demo passes (exit 0)
        run: uv run opseval demo --repeats 1 --junit reports/junit.xml
      - name: Demo catches an injected bug (exit 1)
        run: |
          set +e
          uv run opseval demo --repeats 1 --bug skip-approval
          test $? -eq 1
      - name: Demo catches a forgotten refund method (exit 1)
        run: |
          set +e
          uv run opseval demo --repeats 1 --bug forget-method
          test $? -eq 1
      - name: Demo reports a harness failure, not an agent failure (exit 3)
        run: |
          set +e
          uv run opseval demo --repeats 1 --bug crash
          test $? -eq 3

  console:
    # The web console typechecks, passes its tests (the one rule as the console draws it, and the
    # API token's handling) and builds (ADR-0029, ADR-0031). Vitest and jsdom need Node 22.22+ or 24.15+ (setup-node "22" installs the latest 22.x).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/console/package-lock.json
      - run: npm ci
        working-directory: packages/console
      - run: npm test
        working-directory: packages/console
      - run: npm run build
        working-directory: packages/console

  # The container image (ADR-0038): it builds from the lock, and the one rule holds inside it.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t opseval:ci .
      - name: Demo exit codes inside the image are 0 / 1 / 1 / 3
        run: |
          set +e
          docker run --rm opseval:ci demo --repeats 1; test $? -eq 0 || exit 1
          docker run --rm opseval:ci demo --repeats 1 --bug skip-approval; test $? -eq 1 || exit 1
          docker run --rm opseval:ci demo --repeats 1 --bug forget-method; test $? -eq 1 || exit 1
          docker run --rm opseval:ci demo --repeats 1 --bug crash; test $? -eq 3 || exit 1
      - name: It does not run as root
        run: test "$(docker run --rm --entrypoint id opseval:ci -u)" != "0"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Known vulnerabilities and licences of runtime dependencies
        run: make audit

  action:
    # Dogfood the composite action (action.yml) against the demo agent.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      OPSEVAL_ALLOWED_HOSTS: 127.0.0.1
      CATALOGUE: packages/opseval/src/opseval/demo/catalogue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Start the demo agent (healthy on 8765, skip-approval bug on 8766)
        run: |
          uv sync --locked
          # Run the agents on the venv's Python, not `uv run`: a long-lived uv process
          # holds the cache lock and stalls setup-uv's post-job cache prune.
          nohup .venv/bin/python -m opseval.demo.refund_agent --port 8765 > agent.log 2>&1 &
          nohup .venv/bin/python -m opseval.demo.refund_agent --port 8766 --bug skip-approval > agent-bug.log 2>&1 &
          for port in 8765 8766; do
            up=no
            for _ in $(seq 1 50); do
              if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then up=yes; break; fi
              sleep 0.2
            done
            if [ "$up" != yes ]; then cat agent.log agent-bug.log; echo "demo agent on $port did not start"; exit 1; fi
          done
      - name: Opseval gate (healthy agent)
        id: healthy
        uses: ./
        with:
          suite: ${{ env.CATALOGUE }}/suites/smoke.yaml
          profile: ${{ env.CATALOGUE }}/profile.yaml
          target: ws://127.0.0.1:8765
          repeats: "1"
      - name: Opseval gate (agent with a bug)
        id: buggy
        continue-on-error: true
        uses: ./
        with:
          suite: ${{ env.CATALOGUE }}/suites/smoke.yaml
          profile: ${{ env.CATALOGUE }}/profile.yaml
          target: ws://127.0.0.1:8766
          repeats: "1"
          comment: "false"
          artifact-name: opseval-report-bug
      - name: The action passes Opseval's exit codes through
        env:
          HEALTHY_CODE: ${{ steps.healthy.outputs.exit-code }}
          HEALTHY_GATE: ${{ steps.healthy.outputs.gate }}
          BUG_CODE: ${{ steps.buggy.outputs.exit-code }}
          BUG_OUTCOME: ${{ steps.buggy.outcome }}
        run: |
          test "$HEALTHY_CODE" = "0" && test "$HEALTHY_GATE" = "pass"
          test "$BUG_CODE" = "1" && test "$BUG_OUTCOME" = "failure"
