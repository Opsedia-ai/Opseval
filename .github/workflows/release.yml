name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # Nothing reaches PyPI that did not pass the same checks as a pull request: the full
  # `make check` and the four demo exit codes, on the tagged commit itself.
  # Every supported Python, as CI does, so a release never ships what CI would have caught.
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check
      # The tag, both packages and the plugin's pin on opseval must agree, so pip can never
      # pair pytest-opseval with an opseval it was not tested against.
      - name: Versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_release.py "$TAG"
      - name: Demo exit codes are 0 / 1 / 1 / 3
        run: |
          set +e
          uv run opseval demo --repeats 1; test $? -eq 0 || exit 1
          uv run opseval demo --repeats 1 --bug skip-approval; test $? -eq 1 || exit 1
          uv run opseval demo --repeats 1 --bug forget-method; test $? -eq 1 || exit 1
          uv run opseval demo --repeats 1 --bug crash; test $? -eq 3 || exit 1
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Both packages the README tells people to install.
      - run: uv build --package opseval --out-dir dist
      - run: uv build --package pytest-opseval --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
