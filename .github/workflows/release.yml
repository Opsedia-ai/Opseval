name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # Nothing reaches PyPI that did not pass the same checks as a pull request: the full
  # `make check` and the four demo exit codes, on the tagged commit itself.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - run: make check
      - name: Demo exit codes are 0 / 1 / 1 / 3
        run: |
          set +e
          uv run opseval demo --repeats 1; test $? -eq 0 || exit 1
          uv run opseval demo --repeats 1 --bug skip-approval; test $? -eq 1 || exit 1
          uv run opseval demo --repeats 1 --bug forget-method; test $? -eq 1 || exit 1
          uv run opseval demo --repeats 1 --bug crash; test $? -eq 3 || exit 1
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # Both packages the README tells people to install.
      - run: uv build --package opseval --out-dir dist
      - run: uv build --package pytest-opseval --out-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
