# Actions are pinned to commit SHAs (a tag can be moved); Dependabot keeps the pins current
# and the version comments honest.
version: 2
updates:
  - package-ecosystem: github-actions
    # The composite action lives twice, byte for byte (root action.yml and its source under
    # integrations/github-action, ADR-0058; test_github_ci keeps them identical), so Dependabot
    # must update both in the same pull request or the identity test fails it.
    directories: ["/", "/integrations/github-action"]
    schedule:
      interval: weekly
    groups:
      actions:
        group-by: dependency-name
        patterns: ["*"]
  # The image's base images are pinned by digest (Dockerfile, ADR-0038).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image's Python must be one CI tests (ci.yml: 3.11–3.13). New digests of 3.12 still
      # arrive (security fixes); a move to a newer Python comes with the CI matrix change.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
